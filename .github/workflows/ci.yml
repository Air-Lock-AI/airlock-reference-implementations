name: CI

on:
  pull_request:
    paths:
      - 'agentcore/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'agentcore/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: agentcore

jobs:
  agentcore:
    name: agentcore — typecheck + test + bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentcore/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Bundle as a smoke check: the import.meta.url shim and asset shape
      # have failure modes that only surface at bundle time, so we exercise
      # the same path the deploy workflow does.
      - run: npm run bundle
